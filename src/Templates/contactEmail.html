<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>New Contact - Smart Agri-Connect</title>
  <style>
    body {
      font-family: Arial;
      background: #f4f8f4;
      margin: 0;
      padding: 0;
    }

    .container {
      max-width: 600px;
      margin: 20px auto;
      background: #fff;
      border-radius: 10px;
      overflow: hidden;
      border: 1px solid #dfeadf;
    }

    .header {
      background: #2e7d32;
      color: white;
      text-align: center;
      padding: 20px;
    }

    .content {
      padding: 20px;
    }

    .field {
      margin-bottom: 12px;
      padding: 10px;
      background: #f7fdf7;
      border-left: 4px solid #2e7d32;
    }

    .label {
      font-weight: bold;
      color: #2e7d32;
    }

    .footer {
      text-align: center;
      padding: 15px;
      font-size: 12px;
      color: #777;
      background: #f1f1f1;
    }
  </style>
</head>

<body>
  <div class="container">

    <div class="header">
      🌾 New Contact Message - Smart Agri-Connect
    </div>

    <div class="content">

      <div class="field">
        <span class="label">Name:</span> {{name}}
      </div>

      <div class="field">
        <span class="label">Email:</span> {{email}}
      </div>

      <div class="field">
        <span class="label">Product:</span> {{product}}
      </div>

      <div class="field">
        <span class="label">Cost:</span> {{cost}}
      </div>

      <div class="field">
        <span class="label">Quantity:</span> {{quantity}}
      </div>

      <div class="field">
        <span class="label">Message:</span>
        <p>{{message}}</p>

    <div class="footer">
      © 2025 Smart Agri-Connect
    </div>

  </div>
</body>
</html>
