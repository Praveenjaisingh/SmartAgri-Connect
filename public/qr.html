<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Payment - Smart Agri-Connect</title>

  <link rel="stylesheet" href="styles.css">

  <style>
    .payment-section {
      text-align: center;
      padding: 30px;
    }

    .upi-qr-code {
      display: none;
      margin: 20px auto;
      width: 250px;
      background-color: #fff;
      padding: 20px;
      border: 2px solid #ddd;
      border-radius: 8px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
    }

    .upi-qr-code img {
      width: 100%;
      height: auto;
    }

    .btn-upi,
    .back {
      display: inline-block;
      padding: 10px 20px;
      margin: 10px;
      background-color: #4CAF50;
      color: white;
      text-decoration: none;
      border-radius: 5px;
      cursor: pointer;
    }

    .btn-upi:hover,
    .back:hover {
      background-color: #45a049;
    }

    .note {
      margin: 20px 0;
      color: #555;
    }
  </style>
</head>

<body>

  <header>
    <h1>Smart Agri-Connect</h1>
  </header>

  <main>
    <section class="payment-section">

      <h2>💳 Complete Your Payment</h2>

      <p class="note">
        If you have Google Pay, PhonePe, Paytm, BHIM, or any UPI app installed,
        click the button below. Otherwise, scan the QR code.
      </p>
      <a id="upiBtn" class="btn-upi" href="upi://pay?pa=dpp469926@okaxis&pn=Smart%20Agri%20Connect&am=100&cu=INR">
        Pay via UPI App
      </a>

      <a href="javascript:void(0)" class="btn-upi" onclick="showQR()">
        Scan QR Code
      </a>

      <div id="upiQR" class="upi-qr-code">
        <img src="image/QR.jpeg" alt="UPI QR Code">
        <p>Scan using any UPI app</p>
      </div>

      <br>

      <a href="payment.html" class="back">Back</a>

    </section>
  </main>

  <footer>
    <p>&copy; 2025 Smart Agri-Connect. All rights reserved.</p>
  </footer>

  <script>

    history.pushState(null, null, location.href);

    window.onpopstate = function () {
      history.go(1);
    };

    const isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);

    if (!isMobile) {
      document.getElementById("upiBtn").style.display = "none";
    }

    function showQR() {

      const qrCode = document.getElementById("upiQR");

      qrCode.style.display =
        qrCode.style.display === "block"
          ? "none"
          : "block";

      if (qrCode.style.display === "block") {

        setTimeout(() => {

          const paid = confirm(
            "Have you completed the payment?"
          );

          if (paid) {
            alert("✅ Thank you! Payment confirmation received.");
            window.location.href = "paymentthankyou.html";
          } else {
            alert("⚠️ Payment not confirmed.");
          }

        }, 7000);
      }
    }
    document.getElementById("upiBtn")?.addEventListener("click", () => {

      setTimeout(() => {

        const paid = confirm(
          "Have you completed the payment in your UPI app?"
        );

        if (paid) {
          alert("✅ Thank you! Payment confirmation received.");
          window.location.href = "paymentthankyou.html";
        }

      }, 10000);

    });

  </script>

</body>

</html>
