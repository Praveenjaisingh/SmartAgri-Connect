<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Forgot Password - Smart Agri-Connect</title>
  <link rel="stylesheet" href="styles.css" />
</head>

<body>

  <div class="background-container">
    <div class="login-container">
      <header>
        <h1>Smart Agri-Connect</h1>
      </header>

      <main>
        <section class="login-form">
          <h2>Reset Your Password</h2>
          <p>Please enter your email address. We will send you a link to reset your password.</p>

          <form id="forgot-form">
            <div class="input-group">
              <label for="email">Email Address</label>
              <input type="email" id="email" name="email" placeholder="Enter your email" required />
            </div>

            <button type="submit" class="btn">Send Reset Link</button>
          </form>
          <div id="loader" class="loader-overlay" style="display:none;">
            <div class="spinner"></div>
          </div>

          <p id="feedback"></p>

          <div class="links">
            <a href="index.html">Back to Login</a>
            <a href="register.html">Don't have an account? Register</a>
          </div>
        </section>
      </main>
    </div>
  </div>

  <footer>
    <p>&copy; 2025 Smart Agri-Connect. All rights reserved.</p>
  </footer>
  <script>
    function showLoader() {
      document.getElementById("loader").style.display = "flex";
    }

    function hideLoader() {
      document.getElementById("loader").style.display = "none";
    }
    document.addEventListener("DOMContentLoaded", function () {
      const form = document.getElementById("forgot-form");
      const feedback = document.getElementById("feedback");

      form.addEventListener("submit", async function (e) {
        e.preventDefault();

        const email = document.getElementById("email").value.trim();

        if (!email) {
          feedback.textContent = "Please enter your email.";
          feedback.style.color = "red";
          return;
        }

        try {
          showLoader();
          const response = await fetch("/api/users/forget-password", {
            method: "POST",
            headers: {
              "Content-Type": "application/json"
            },
            body: JSON.stringify({ email })
          });

          const data = await response.json();
          hideLoader();

          if (!response.ok) {
            throw new Error(data.errors || "Something went wrong");
          }

          feedback.textContent = "Reset link sent to your email!";
          feedback.style.color = "green";
          window.location.href = "forgetpasswordsuccess.html";
          form.reset();

        } catch (error) {
          hideLoader();
          feedback.textContent = error.message;
          feedback.style.color = "red";
        }
      });
    });
  </script>
</body>

</html>
