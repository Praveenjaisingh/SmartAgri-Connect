<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login - Smart Agri-Connect</title>
  <link rel="stylesheet" href="styles.css" />

</head>

<body>

  <div class="background-container">
    <div class="login-container">
      <header>
        <h1>Smart Agri-Connect</h1>
      </header>

      <main>
        <section class="login-form">
          <h2>Login to Smart Agri-Connect</h2>
          <form class="login-form-section">
            <div class="input-group">
              <label for="username">Email or Username</label>
              <input type="text" id="username" name="username" placeholder="Enter your username or email" required
                aria-required="true" />
              <span id="username-error" class="error-message" role="alert"></span>
            </div>

            <div class="input-group" style="position: relative;">
               <label for="password">Password</label>
                 <input type="password" id="password" name="password" placeholder="Enter your password" required />
                   <span onclick="togglePassword('password', this)"
                     style="position:absolute; right:10px; top:38px; cursor:pointer;">👁️
                    </span>
            </div>
            <button type="submit" class="btn">Login</button>

            <div class="links">
              <a href="forgetpassword.html">Forgot Password?</a>
              <a href="register.html">Don't have an account? Register</a>
            </div>
          </form>


        </section>
      </main>
    </div>
  </div>

  <footer>
    <p>&copy; 2025 Smart Agri-Connect. All rights reserved.</p>
  </footer>
 <script>

  function showToast(message, type) {
    let toast = document.getElementById("toast");

    if (!toast) {
      toast = document.createElement("div");
      toast.id = "toast";
      toast.style.marginTop = "10px";
      toast.style.padding = "10px";
      toast.style.borderRadius = "5px";
      toast.style.color = "white";
      toast.style.textAlign = "center";
      document.querySelector(".login-form").appendChild(toast);
    }

    toast.style.display = "block";
    toast.innerText = message;
    toast.style.background = type === "success" ? "green" : "red";

    setTimeout(() => {
      toast.style.display = "none";
    }, 3000);
  }

  function togglePassword(fieldId, el) {
        const input = document.getElementById(fieldId);

        if (input.type === "password") {
          input.type = "text";
          el.textContent = "🙈";
        } else {
          input.type = "password";
          el.textContent = "👁️";
        }
      }

  document.addEventListener('DOMContentLoaded', function () {

    console.log("JS Loaded ✅");

    const loginForm = document.querySelector('.login-form-section');

    if (!loginForm) {
      console.error("Form not found ❌");
      return;
    }

    const submitBtn = loginForm.querySelector("button");

    loginForm.addEventListener('submit', async function (event) {
      event.preventDefault();

      console.log("Form Submitted ✅");

      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value.trim();

      if (!username || !password) {
        showToast("All fields are required", "error");
        return;
      }
      submitBtn.disabled = true;
      submitBtn.innerText = "Logging in...";

      try {
        console.log("Calling API...");

        const res = await fetch('/api/users/login', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            email: username,
            password: password
          })
        });

        const data = await res.json();

        console.log("Backend Response:", data);

        if (data.status) {
          showToast(data.message || "Login successful", "success");

          localStorage.setItem("token", data.token);

          setTimeout(() => {
            window.location.href = "home.html";
          }, 1500);

        } else {
          showToast(data.errors || "Login failed", "error");
        }

      } catch (err) {
        console.error("Error:", err);
        showToast("Server error", "error");
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerText = "Login";
      }

    });

  });

</script>
</body>

</html>
