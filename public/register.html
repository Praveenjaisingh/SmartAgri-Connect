<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Register - Smart Agri-Connect</title>
  <link rel="stylesheet" href="styles.css">

</head>

<body>

  <header>
    <h1>Smart Agri-Connect</h1>
  </header>

  <main>
    <section class="register-container">
      <h2>Create Your Account</h2>
      <form method="POST" action="register-form" class="register-form">
        <div class="input-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" name="email" placeholder="Enter your email" required />
          <span id="email-error" class="error-message"></span>
        </div>

        <div class="input-group">
          <label for="username">Username</label>
          <input type="text" id="username" name="username" placeholder="Enter your username" required />
          <span id="username-error" class="error-message"></span>
        </div>

        <div class="input-group" style="position: relative;">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" placeholder="Enter your password" required />

          <span onclick="togglePassword('password', this)"
            style="position:absolute; right:10px; top:38px; cursor:pointer;">
            👁️
          </span>
        </div>

        <div class="input-group" style="position: relative;">
          <label for="confirm_password">Confirm Password</label>
          <input type="password" id="confirm_password" name="confirm_password" placeholder="Confirm your password"
            required />

          <span onclick="togglePassword('confirm_password', this)"
            style="position:absolute; right:10px; top:38px; cursor:pointer;">
            👁️
          </span>
        </div>

        <button type="submit" class="btn">Register</button>
      </form>
      <div id="loader" class="loader-overlay" style="display:none;">
        <div class="spinner"></div>
      </div>


      <div class="links">
        <p>Already have an account? <a href="index.html">Login here</a></p>
      </div>
    </section>
  </main>

  <footer>
    <p>&copy; 2025 Smart Agri-Connect. All rights reserved.</p>
  </footer>
  <script>
    history.pushState(null, null, location.href);
    window.onpopstate = function () {
      history.go(1);
    };
    function showToast(message, type) {
      let toast = document.getElementById("toast");

      if (!toast) {
        toast = document.createElement("div");
        toast.id = "toast";
        toast.style.marginTop = "10px";
        toast.style.padding = "10px";
        toast.style.borderRadius = "5px";
        toast.style.color = "white";
        toast.style.textAlign = "center";
        document.querySelector(".register-form").appendChild(toast);
      }

      toast.style.display = "block";
      toast.innerText = message;
      toast.style.background = type === "success" ? "green" : "red";

      setTimeout(() => {
        toast.style.display = "none";
      }, 3000);
    }
    function togglePassword(fieldId, el) {
      const input = document.getElementById(fieldId);

      if (input.type === "password") {
        input.type = "text";
        el.textContent = "🙈";
      } else {
        input.type = "password";
        el.textContent = "👁️";
      }
    }

    const registerForm = document.querySelector('.register-form');

    function showLoader() {
      document.getElementById("loader").style.display = "flex";
    }

    function hideLoader() {
      document.getElementById("loader").style.display = "none";
    }

    registerForm.addEventListener('submit', async function (event) {
      event.preventDefault();

      const email = document.getElementById('email').value.trim();
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value.trim();
      const confirmPassword = document.getElementById('confirm_password').value.trim();

      if (password !== confirmPassword) {
        alert("Passwords do not match");
        return;
      }

      try {
        showLoader();
        const res = await fetch('/api/users/create', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            name: username,
            email: email,
            password: password,
            confirmPassword: confirmPassword
          })
        });

        const data = await res.json();
        hideLoader();

        if (data.status) {
          showToast(data.errors || "Sign-in successful", "success");
          window.location.href = "success.html";
        } else {
          showToast(data.errors || "Sign-in failed", "error");
        }

      } catch (err) {
        hideLoader();
        console.error(err);
        showToast("Server error", "error");
      }
    });
  </script>
</body>

</html>
