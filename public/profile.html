<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Profile - Smart Agri-Connect</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    nav a { margin:0 10px; color:#2d6a2d; text-decoration:none; font-weight:600; }
    nav { background:#f0f7f0; padding:12px 24px; display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
    .nav-brand { font-weight:700; color:#2d6a2d; flex:1; font-size:1.1rem; }
    .profile-container { max-width:500px; margin:40px auto; background:#fff; border-radius:12px; box-shadow:0 2px 12px rgba(0,0,0,.1); padding:30px; }
    .profile-container h2 { text-align:center; color:#2d6a2d; margin-bottom:24px; }
    .form-group { margin-bottom:18px; }
    .form-group label { display:block; margin-bottom:6px; font-weight:600; color:#444; }
    .form-group input { width:100%; padding:10px; border:1px solid #ccc; border-radius:6px; font-size:1rem; box-sizing:border-box; }
    .form-group input:focus { outline:none; border-color:#2d6a2d; }
    .btn-save { width:100%; background:#2d6a2d; color:#fff; border:none; padding:12px; border-radius:8px; font-size:1rem; cursor:pointer; font-weight:600; }
    .btn-save:hover { background:#1f4f1f; }
    .section-title { font-size:1rem; font-weight:700; color:#2d6a2d; margin:20px 0 10px; border-bottom:2px solid #e0f0e0; padding-bottom:6px; }
    #profile-msg { text-align:center; margin-top:12px; padding:10px; border-radius:6px; display:none; }
    .success { background:#d4edda; color:#155724; }
    .error   { background:#f8d7da; color:#721c24; }
    .avatar { width:80px; height:80px; background:#2d6a2d; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:2rem; color:#fff; margin:0 auto 20px; }
  </style>
</head>
<body>
  <nav>
    <span class="nav-brand">🌾 Smart Agri-Connect</span>
    <a href="home.html">Home</a>
    <a href="orders.html">Orders</a>
    <a href="wishlist.html">Wishlist</a>
    <a href="#" onclick="logoutUser()">Logout</a>
  </nav>

  <div class="profile-container">
    <div class="avatar" id="avatar-initials">👤</div>
    <h2>My Profile</h2>

    <div class="section-title">Account Info</div>
    <div class="form-group">
      <label>Full Name</label>
      <input type="text" id="prof-name" placeholder="Your name" />
    </div>
    <div class="form-group">
      <label>Email</label>
      <input type="email" id="prof-email" disabled style="background:#f5f5f5" />
    </div>

    <div class="section-title">Change Password</div>
    <div class="form-group">
      <label>Current Password</label>
      <input type="password" id="current-password" placeholder="Leave blank to keep unchanged" />
    </div>
    <div class="form-group">
      <label>New Password</label>
      <input type="password" id="new-password" placeholder="Minimum 6 characters" />
    </div>

    <button class="btn-save" onclick="saveProfile()">Save Changes</button>
    <div id="profile-msg"></div>
  </div>

  <script src="script.js"></script>
  <script>
    const token = localStorage.getItem("token");

    async function loadProfile() {
      const res = await fetch("/api/users/profile", { headers: { Authorization: `Bearer ${token}` } });
      const data = await res.json();
      if (data.status) {
        document.getElementById("prof-name").value = data.data.name || "";
        document.getElementById("prof-email").value = data.data.email || "";
        const initials = (data.data.name || "U")[0].toUpperCase();
        document.getElementById("avatar-initials").textContent = initials;
      }
    }

    async function saveProfile() {
      const msg = document.getElementById("profile-msg");
      const body = { name: document.getElementById("prof-name").value };
      const currentPwd = document.getElementById("current-password").value;
      const newPwd = document.getElementById("new-password").value;

      if (currentPwd && newPwd) {
        body.currentPassword = currentPwd;
        body.newPassword = newPwd;
      }

      try {
        const res = await fetch("/api/users/profile", {
          method: "PUT",
          headers: { "Content-Type": "application/json", Authorization: `Bearer ${token}` },
          body: JSON.stringify(body)
        });
        const data = await res.json();
        msg.style.display = "block";
        msg.className = data.status ? "success" : "error";
        msg.textContent = data.status ? "Profile updated successfully!" : (data.errors?.[0] || "Update failed");
        if (data.status) {
          document.getElementById("current-password").value = "";
          document.getElementById("new-password").value = "";
        }
      } catch (e) {
        msg.style.display = "block";
        msg.className = "error";
        msg.textContent = "Server error";
      }
      setTimeout(() => msg.style.display = "none", 3000);
    }

    loadProfile();
  </script>
</body>
</html>
