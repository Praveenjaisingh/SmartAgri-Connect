<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Payment - Smart Agri-Connect</title>
  <link rel="stylesheet" href="styles.css" />
</head>

<body>

  <header>
    <h1>Smart Agri-Connect</h1>
    <nav>
      <a href="home.html">Home</a>
      <a href="marketplace.html">Marketplace</a>
      <a href="features.html">Features</a>
      <a href="about.html">About</a>
      <a href="faq.html">FAQs</a>
      <a href="contact.html">Contact</a>
    </nav>
    <a href="index.html" class="logout-btn">Logout</a>
  </header>

  <main>
    <section class="payment-section">
      <h2>💳 Complete Your Payment</h2>

      <p>Your cart total will be calculated automatically.</p>

      <button type="button" class="btn" onclick="payViaUPI()">
        Pay via UPI
      </button>

      <br><br>

      <button type="button" class="btn" onclick="openQR()">
        Show QR Code
      </button>

    </section>
  </main>

  <footer>
    <p>&copy; 2025 Smart Agri-Connect. All rights reserved.</p>
  </footer>

  <script>
    history.pushState(null, null, location.href);
    window.onpopstate = function () {
      history.go(1);
    };

    // token check
    async function verifyUser() {
      const token = localStorage.getItem("token");

      if (!token) {
        window.location.href = "index.html";
        return;
      }

      try {
        const res = await fetch('/api/users/verify-token', {
          method: 'GET',
          headers: {
            'Authorization': 'Bearer ' + token
          }
        });

        const data = await res.json();

        if (!data.status) {
          localStorage.removeItem("token");
          window.location.href = "index.html";
        }

      } catch (err) {
        localStorage.removeItem("token");
        window.location.href = "index.html";
      }
    }

    verifyUser();


    // UPI Payment
    async function payViaUPI() {

      const token = localStorage.getItem("token");

      try {
        const response = await fetch('/api/users/upi-payment', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${token}`
          }
        });

        const data = await response.json();

        if (!data.status) {
          alert(data.message);
          return;
        }

        const upiUrl = data.data.upiUrl;

        // open UPI apps
        window.location.href = upiUrl;

        // fallback QR
        setTimeout(() => {
          window.location.href = "qr.html";
        }, 2000);

      } catch (err) {
        alert("Payment error");
      }
    }

    // direct QR page
    function openQR() {
      window.location.href = "qr.html";
    }

  </script>

</body>

</html>
