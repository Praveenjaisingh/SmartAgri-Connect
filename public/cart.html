<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Your Cart - Smart Agri-Connect</title>

  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      margin: 0;
      padding: 0;
      background: #f7f9fc;
      color: #333;
    }

    header {
      background-color: #3f9142;
      color: #fff;
      padding: 20px;
      text-align: center;
    }

    nav a {
      color: #fff;
      text-decoration: none;
      margin: 0 12px;
      padding: 8px 12px;
      border-radius: 6px;
    }

    nav a:hover {
      background-color: rgba(255, 255, 255, 0.2);
    }

    .btn {
      background-color: #28a745;
      color: #fff !important;
      padding: 8px 16px;
      border-radius: 5px;
      text-decoration: none;
      display: inline-block;
      margin-top: 10px;
    }

    main {
      padding: 40px 20px;
    }

    .cart-section {
      max-width: 1000px;
      margin: auto;
      background: #fff;
      padding: 25px;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
      border-radius: 10px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th,
    td {
      padding: 12px;
      text-align: center;
      border-bottom: 1px solid #ddd;
    }

    th {
      background-color: #e9f5ec;
    }

    input[type="number"] {
      width: 60px;
      padding: 5px;
    }

    button {
      background: #dc3545;
      color: white;
      border: none;
      padding: 6px 12px;
      cursor: pointer;
      border-radius: 5px;
    }

    #totalAmount {
      text-align: right;
      font-size: 18px;
      font-weight: bold;
      margin-top: 10px;
    }

    footer {
      background: #3f9142;
      color: white;
      text-align: center;
      padding: 10px;
      margin-top: 30px;
    }
    #toast {
      visibility: hidden;
      min-width: 250px;
      background-color: #dc3545;
      color: #fff;
      text-align: center;
      border-radius: 5px;
      padding: 12px;
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 1000;
    }
    .search-bar {
      display: flex;
      gap: 10px;
      margin: 15px 0;
    }

    .search-bar input {
      flex: 1;
      padding: 10px;
      border-radius: 6px;
      border: 1px solid #ccc;
    }

    .search-bar button {
      padding: 10px 15px;
      background: green;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }
    .loading {
      text-align: center;
      padding: 20px;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <header>
    <h1>Smart Agri-Connect</h1>
    <nav>
      <a href="marketplace.html">Marketplace</a>
    </nav>
  </header>

  <main>
    <section class="cart-section">
      <h2>Your Cart</h2>
      <div class="search-bar">
        <input type="text" id="searchInput" placeholder="Search cart items..." />
        <button onclick="fetchCart()">Search</button>
      </div>

      <table id="cartTable">
        <thead>
          <tr>
            <th>Product</th>
            <th>Price</th>
            <th>Quantity</th>
            <th>Total</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>

      <p id="totalAmount">Total: ₹0</p>

      <a href="#" class="btn" onclick="handleCheckout()">Proceed to Checkout</a>
    </section>
  </main>

  <footer>
    <p>&copy; 2025 Smart Agri-Connect</p>
  </footer>


  <div id="toast">Minimum 1 product is required to proceed!</div>

  <script>
    let cart = [];
    history.pushState(null, null, location.href);
    window.onpopstate = function () {
      history.go(1);
    };

    async function verifyUser() {
      const token = localStorage.getItem("token");

      if (!token) {
        window.location.href = "index.html";
        return;
      }

      try {
        const res = await fetch('/api/users/verify-token', {
          method: 'GET',
          headers: {
            'Authorization': 'Bearer ' + token
          }
        });

        const data = await res.json();

        console.log("Verify Response:", data);
        if (!data.status) {
          localStorage.removeItem("token");
          window.location.href = "index.html";
        }

      } catch (err) {
        console.error("Verification error:", err);
        localStorage.removeItem("token");
        window.location.href = "index.html";
      }
    }
    verifyUser();

    async function fetchCart() {
      const token = localStorage.getItem("token");

      const search = document.getElementById("searchInput")?.value || "";

      const tbody = document.querySelector("#cartTable tbody");
      tbody.innerHTML = "<tr><td colspan='5'>Loading...</td></tr>";

      try {
        const response = await fetch("/api/users/product-list", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Authorization": "Bearer " + token
          },
          body: JSON.stringify({
            search: search
          })
        });

        const data = await response.json();

        cart = data.data || [];
        renderCart();

      } catch (error) {
        console.error("Error fetching cart:", error);
        tbody.innerHTML = "<tr><td colspan='5'>Error loading cart</td></tr>";
      }
    }
    function renderCart() {
      const tbody = document.querySelector("#cartTable tbody");
      tbody.innerHTML = "";

      let total = 0;

      cart.forEach((item, index) => {

        const name = item.product;
        const price = Number(item.cost);
        const qty = Number(item.Quantity);
        const itemTotal = Number(item.total);

        total += itemTotal;

        tbody.innerHTML += `
      <tr>
        <td>${name}</td>
        <td>₹${price}</td>
        <td>
          <input type="number" min="1" value="${qty}"
            onchange="updateQuantity(${index}, this.value)">
        </td>
        <td>₹${itemTotal}</td>
        <td><button onclick="removeItem(${index})">Remove</button></td>
      </tr>
    `;
      });

      document.getElementById("totalAmount").innerText = "Total: ₹" + total;
    }
    function updateQuantity(index, qty) {
      qty = parseInt(qty);
      if (!qty || qty <= 0) return;

      cart[index].quantity = qty;
      renderCart();
    }
    async function removeItem(index) {
      const item = cart[index];

      console.log("Deleting item:", item); 

      try {
        const response = await fetch("/api/users/delete", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Authorization": "Bearer " + localStorage.getItem("token")
          },
          body: JSON.stringify({
            id: item.id   
          })
        });

        const result = await response.json();

        if (response.ok) {
          await fetchCart(); 
        } else {
          showToast(result.message || "Failed to remove item");
        }

      } catch (error) {
        console.error("Error removing item:", error);
        showToast("Something went wrong!");
      }
    }
    function handleCheckout() {
      if (!cart || cart.length === 0) {
        showToast("Minimum 1 product is required to proceed!");
        return;
      }

      window.location.replace("payment.html");
    }
    function showToast(message) {
      const toast = document.getElementById("toast");
      toast.innerText = message;
      toast.style.visibility = "visible";

      setTimeout(() => {
        toast.style.visibility = "hidden";
      }, 3000);
    }

    fetchCart();
  </script>

</body>

</html>
